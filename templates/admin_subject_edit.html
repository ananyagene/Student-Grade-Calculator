{% extends "base.html" %}

{% block title %}Edit Subject - {{ subject.subject_code }}{% endblock %}

{% block content %}
<div class="calculator-container" style="max-width: 650px;">
    <div class="page-header">
        <div>
            <h2>✏️ Edit Subject: {{ subject.subject_code }}</h2>
            <p class="subtitle">Modify course mapping, semester, or assigned teacher.</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('admin_subjects') }}" class="btn-secondary">⬅️ Cancel</a>
        </div>
    </div>

    {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_subject_edit', subject_id=subject.id) }}" class="entry-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="subject_code">Subject Code *</label>
                <input 
                    type="text" 
                    id="subject_code" 
                    name="subject_code" 
                    value="{{ subject.subject_code }}" 
                    required
                >
            </div>

            <div class="form-group full-width">
                <label for="subject_name">Subject Name *</label>
                <input 
                    type="text" 
                    id="subject_name" 
                    name="subject_name" 
                    value="{{ subject.subject_name }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="course_id">Course / Program *</label>
                <select id="course_id" name="course_id" required>
                    {% for c in courses %}
                        <option value="{{ c.id }}" {% if c.id == subject.course_id %}selected{% endif %}>
                            {{ c.course_code }} - {{ c.course_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester Number *</label>
                <input 
                    type="number" 
                    id="semester" 
                    name="semester" 
                    value="{{ subject.semester }}" 
                    min="1" 
                    max="12" 
                    required
                >
            </div>

            <div class="form-group full-width">
                <label for="teacher_id">Assigned Faculty / Teacher</label>
                <select id="teacher_id" name="teacher_id">
                    <option value="">-- Unassigned --</option>
                    {% for t in teachers %}
                        <option value="{{ t.id }}" {% if t.id == subject.teacher_id %}selected{% endif %}>
                            {{ t.name }} ({{ t.username }}) - {{ t.assigned_course or 'All Courses' }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 15px;">Update Subject</button>
    </form>
</div>
{% endblock %}
