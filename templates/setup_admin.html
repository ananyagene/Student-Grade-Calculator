{% extends "base.html" %}

{% block title %}Setup Initial Admin - Result Management System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Initial Admin Setup</h2>
            <p class="subtitle">Configure the primary Administrator account for your system.</p>
        </div>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('setup_admin') }}" class="entry-form">
            <div class="form-group">
                <label for="name">Admin Full Name *</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="e.g. System Administrator" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="username">Admin Username *</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="e.g. admin" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Min 4 characters" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Re-enter password" 
                    required
                >
            </div>

            <button type="submit" class="btn-calculate" style="margin-top: 15px;">Create Admin Account</button>
        </form>

        <div style="margin-top: 18px; text-align: center; font-size: 14px;">
            <p><a href="{{ url_for('login') }}" style="color: #2980b9; font-weight: bold; text-decoration: none;">&larr; Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
